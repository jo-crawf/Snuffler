[package]
name = "snuffler"
version = "1.0.1"
edition = "2021"
description = "Removes zero-size ghost images that accumulate in Excel worksheets (GhostBuster for macOS)"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
# Pure-Rust imaging. On Windows GhostBuster reaches WIC through the OS; the Mac
# equivalent (ImageIO) would be just as native, but a pure-Rust encoder gives
# the same bytes on every platform -- which is what lets the whole repair core
# be built and tested somewhere other than a Mac.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
# Directly, as well as through `image`: palette PNGs are re-packed without
# ever being expanded, which `image`'s decoder always does.
png = "0.18"
# The `image` crate's own JPEG encoder only does 4:4:4 chroma; WIC uses 4:2:0.
jpeg-encoder = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
